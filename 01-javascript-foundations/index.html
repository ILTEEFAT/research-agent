<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Research Assistant</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 1000px;

            margin: 40px auto;

            padding: 0 20px;

        }


        h1 {

            margin-bottom: 20px;

        }


        .search-box {

            display: flex;

            gap: 10px;

        }


        input {

            flex: 1;

            padding: 12px;

            font-size: 16px;

            border: 1px solid #999;

            border-radius: 5px;

        }


        button {

            padding: 12px 24px;

            font-size: 16px;

            cursor: pointer;

        }


        #statusDisplay {

            margin-top: 20px;

            font-weight: bold;

        }


        #report {

            margin-top: 25px;

        }


        .report-box {

            background: #f5f5f5;

            padding: 25px;

            border-radius: 10px;

            line-height: 1.7;

            white-space: pre-wrap;

            overflow-wrap: break-word;

        }


        .sources {

            margin-top: 30px;

        }


        .source {

            margin: 12px 0;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

        }


        .source a {

            text-decoration: none;

        }


        #downloadArea {

            margin-top: 20px;

        }


        .download-button {

            display: inline-block;

            padding: 12px 18px;

            border: 1px solid #333;

            border-radius: 6px;

            text-decoration: none;

            font-weight: bold;

        }

    </style>

</head>


<body>


    <h1>🔬 Research Assistant</h1>


    <div class="search-box">

        <input
            type="text"
            id="researchQuery"
            placeholder="Enter research topic..."
        />


        <button id="researchButton">
            Research
        </button>

    </div>


    <p id="statusDisplay">
        Status: Nothing Started
    </p>


    <div id="report"></div>


    <div id="downloadArea"></div>


    <script src="script.js"></script>


</body>

</html>
